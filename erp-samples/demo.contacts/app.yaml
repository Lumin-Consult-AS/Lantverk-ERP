id: demo.contacts
version: 1.1.0
name: Kontakter
publisher: Jens Nymoen
license: Apache-2.0
sdk: ">=1.0.0 <2.0.0"

dependencies:
  core.parties: ">=1.0.0 <2.0.0"

runtime:
  image: ghcr.io/partner/demo-contacts:1.1.0
  resources:
    cpu: 250m
    memory: 256Mi
  egress:
    - api.hubspot.com:443

enums:
  demo.channel: [email, phone, sms]
  demo.priority: [low, normal, high]

objects:
  demo.contactnote:
    label: Kontaktnotat
    fields:
      party:
        type: reference
        to: core.party
        required: true
        label: contacts.fields.party
      text:
        type: text
        required: true
        label: contacts.fields.text
      followUp:
        type: date
        label: contacts.fields.followUp
      priority:
        type: enum
        of: demo.priority
        label: contacts.fields.priority

extensions:
  core.party:
    fields:
      preferredChannel:
        type: enum
        of: demo.channel
        label: contacts.fields.preferredChannel

events:
  publishes:
    - demo.contactnote.created@1
  subscribes:
    - core.party.deleted@1: OnPartyDeleted

pages:
  - pages/contactnote-list.yaml
  - pages/contactnote-card.yaml
  - extend: core.party-card
    file: pages/party-card-ext.yaml

permissionSets:
  - id: demo.contacts.user
    label: Kontaktbruker
    grants:
      demo.contactnote: [read, create, update, delete]

# 1.1.0 adds the optional field "priority" to contact notes; the migration gives existing notes the priority "normal".
migrations:
  - from: 1.0.0
    to: 1.1.0
    run: Migrations.V110
