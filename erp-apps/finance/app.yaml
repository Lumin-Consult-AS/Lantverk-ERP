id: finance
version: 1.0.0
name: Regnskap
publisher: Laftverk
license: proprietary
sdk: ">=1.0.0 <2.0.0"

dependencies:
  core.parties: ">=1.0.0 <2.0.0"
  core.dimensions: ">=1.0.0 <2.0.0"
  core.organization: ">=1.0.0 <2.0.0"
  core.currencies: ">=1.0.0 <2.0.0"

runtime:
  image: ghcr.io/laftverk/finance:1.0.0
  resources:
    cpu: 250m
    memory: 256Mi

enums:
  finance.accounttype: [asset, liability, equity, revenue, expense]
  finance.controltype: [none, receivable, payable]
  finance.voucherstatus: [draft, posted]
  finance.openitemstatus: [open, settled]
  finance.settlementstatus: [draft, completed]
  finance.side: [debit, credit]
  finance.batchstatus: [draft, pending, approved, released]
  finance.deliverystatus: [none, sent, failed]
  finance.transactionstatus: [new, matched, ignored]

# Landsuavhengig hovedbok. Alt norsk (kontoplan, MVA, SAF-T) ligger i Norge-pakken.
objects:
  # Én post per selskap: selskapets bokføringsvaluta. Kjernen eier selskapet, men apper når ikke selskapsdata gjennom
  # data-API-et, så regnskapsappen har sin egen innstilling.
  finance.settings:
    label: Regnskapsinnstillinger
    fields:
      singleton:
        type: string
        required: true
        maxLength: 20
        default: settings
        label: Nøkkel
      baseCurrency:
        type: string
        required: true
        maxLength: 3
        pattern: "^[A-Z]{3}$"
        label: Bokføringsvaluta
    keys:
      - name: uk_settings_company
        fields: [singleton]
        scopeToCompany: true

  finance.account:
    label: Konto
    fields:
      number:
        type: string
        required: true
        maxLength: 10
        label: Kontonummer
      name:
        type: string
        required: true
        maxLength: 200
        label: Navn
      accountType:
        type: enum
        of: finance.accounttype
        required: true
        label: Kontotype
      controlType:
        type: enum
        of: finance.controltype
        required: true
        default: none
        label: Reskontro
      isActive:
        type: boolean
        required: true
        default: true
        label: Aktiv
    keys:
      - name: uk_account_number
        fields: [number]
        scopeToCompany: true

  # Kladd. Et bilag bokføres ved overgangen «post»; da kontrollerer appen balanse, periode og kontoer, og lager
  # det bokførte bilaget (finance.journalentry) med posteringer (finance.posting) i samme transaksjon.
  finance.voucher:
    label: Bilag
    fields:
      voucherDate:
        type: date
        required: true
        label: Bilagsdato
      description:
        type: string
        maxLength: 500
        label: Tekst
      reverses:
        type: uuid
        label: Motposterer bokført bilag
      status:
        type: enum
        of: finance.voucherstatus
        required: true
        default: draft
        label: Status
    status:
      field: status
      initial: draft
      immutableIn: [posted]
      transitions:
        post:
          from: draft
          to: posted
          permission: post

  finance.voucherline:
    label: Bilagslinje
    fields:
      voucher:
        type: reference
        to: finance.voucher
        required: true
        onDelete: cascade
        label: Bilag
      account:
        type: reference
        to: finance.account
        required: true
        label: Konto
      description:
        type: string
        maxLength: 500
        label: Tekst
      debit:
        type: decimal
        required: true
        scale: 2
        default: 0
        minValue: 0
        label: Debet
      credit:
        type: decimal
        required: true
        scale: 2
        default: 0
        minValue: 0
        label: Kredit
      party:
        type: reference
        to: core.party
        label: Part
      dueDate:
        type: date
        label: Forfallsdato
      dimension1:
        type: reference
        to: core.dimensionvalue
        label: Dimensjon 1
      dimension2:
        type: reference
        to: core.dimensionvalue
        label: Dimensjon 2
      dimension3:
        type: reference
        to: core.dimensionvalue
        label: Dimensjon 3
      # Fremmed valuta: oppgi valuta, beløp i valuta og side. Appen slår opp kursen på bilagsdatoen (eller bruker kursen
      # du har satt selv) og regner ut debet eller kredit i bokføringsvalutaen.
      currency:
        type: string
        maxLength: 3
        pattern: "^[A-Z]{3}$"
        label: Valuta
      currencyAmount:
        type: decimal
        scale: 2
        minValue: 0
        label: Beløp i valuta
      currencySide:
        type: enum
        of: finance.side
        label: Side (valutalinje)
      exchangeRate:
        type: decimal
        scale: 8
        minValue: 0
        label: Kurs
      status:
        type: enum
        of: finance.voucherstatus
        required: true
        default: draft
        label: Status
    status:
      field: status
      initial: draft
      immutableIn: [posted]

  # Det bokførte bilaget. Uforanderlig; korreksjon skjer med et motpostert bilag.
  finance.journalentry:
    label: Bokført bilag
    fields:
      entryNumber:
        type: string
        maxLength: 40
        numberSeries:
          padding: 6
          perYear: true
        label: Bilagsnummer
      voucher:
        type: reference
        to: finance.voucher
        required: true
        label: Kladd
      entryDate:
        type: date
        required: true
        label: Bokføringsdato
      description:
        type: string
        maxLength: 500
        label: Tekst
      fiscalPeriod:
        type: reference
        to: core.fiscalperiod
        required: true
        label: Periode
      reversalOf:
        type: uuid
        label: Motposterer bilag
      status:
        type: enum
        of: finance.voucherstatus
        required: true
        default: posted
        label: Status
    status:
      field: status
      initial: posted
      immutableIn: [posted]
    keys:
      - name: uk_entry_voucher
        fields: [voucher]
        scopeToCompany: true
      - name: uk_entry_reversal
        fields: [reversalOf]
        scopeToCompany: true

  finance.posting:
    label: Postering
    fields:
      entry:
        type: reference
        to: finance.journalentry
        required: true
        label: Bilag
      postingDate:
        type: date
        required: true
        label: Dato
      account:
        type: reference
        to: finance.account
        required: true
        label: Konto
      description:
        type: string
        maxLength: 500
        label: Tekst
      debit:
        type: decimal
        required: true
        scale: 2
        default: 0
        label: Debet
      credit:
        type: decimal
        required: true
        scale: 2
        default: 0
        label: Kredit
      party:
        type: reference
        to: core.party
        label: Part
      dimension1:
        type: reference
        to: core.dimensionvalue
        label: Dimensjon 1
      dimension2:
        type: reference
        to: core.dimensionvalue
        label: Dimensjon 2
      dimension3:
        type: reference
        to: core.dimensionvalue
        label: Dimensjon 3
      currency:
        type: string
        maxLength: 3
        label: Valuta
      currencyAmount:
        type: decimal
        scale: 2
        label: Beløp i valuta
      exchangeRate:
        type: decimal
        scale: 8
        label: Kurs
      fiscalPeriod:
        type: reference
        to: core.fiscalperiod
        required: true
        label: Periode
      status:
        type: enum
        of: finance.voucherstatus
        required: true
        default: posted
        label: Status
    status:
      field: status
      initial: posted
      immutableIn: [posted]

  # Reskontro: åpne poster per part. Opprettes ved bokføring av linjer på reskontrokontoer og reduseres av utligninger.
  finance.openitem:
    label: Åpen post
    fields:
      posting:
        type: reference
        to: finance.posting
        required: true
        label: Postering
      party:
        type: reference
        to: core.party
        required: true
        label: Part
      account:
        type: reference
        to: finance.account
        required: true
        label: Konto
      dueDate:
        type: date
        required: true
        label: Forfallsdato
      amount:
        type: decimal
        required: true
        scale: 2
        label: Beløp
      remaining:
        type: decimal
        required: true
        scale: 2
        label: Åpent beløp
      status:
        type: enum
        of: finance.openitemstatus
        required: true
        default: open
        label: Status
    keys:
      - name: uk_openitem_posting
        fields: [posting]
        scopeToCompany: true

  finance.settlement:
    label: Utligning
    fields:
      settlementDate:
        type: date
        required: true
        label: Dato
      description:
        type: string
        maxLength: 500
        label: Tekst
      status:
        type: enum
        of: finance.settlementstatus
        required: true
        default: draft
        label: Status
    status:
      field: status
      initial: draft
      immutableIn: [completed]
      transitions:
        complete:
          from: draft
          to: completed
          permission: post

  finance.settlementitem:
    label: Utligningslinje
    fields:
      settlement:
        type: reference
        to: finance.settlement
        required: true
        onDelete: cascade
        label: Utligning
      openItem:
        type: reference
        to: finance.openitem
        required: true
        label: Åpen post
      amount:
        type: decimal
        required: true
        scale: 2
        label: Utlignet beløp

  # ------------------------------------------------------------------ bankkontrakten
  # Bank løses med en kontrakt og adaptere (ADR-0028). Kontrakten er disse objektene og hendelsene: regnskapsappen lager en
  # betalingsbunt og publiserer finance.paymentbatch.released@1 når den er godkjent; en bankadapter (en egen app) sender den
  # og skriver resultatet tilbake, og leverer kontoutskrifter og innbetalinger som bankutskrift og banktransaksjon.

  finance.bankaccount:
    label: Bankkonto
    fields:
      name:
        type: string
        required: true
        maxLength: 100
        label: Navn
      accountNumber:
        type: string
        required: true
        maxLength: 34
        label: Kontonummer / IBAN
      bic:
        type: string
        maxLength: 11
        label: BIC
      holderName:
        type: string
        required: true
        maxLength: 140
        label: Kontoeier
      holderId:
        type: string
        maxLength: 35
        label: Kontoeiers identifikator (organisasjonsnummer)
      ledgerAccount:
        type: reference
        to: finance.account
        required: true
        label: Hovedbokskonto
      currency:
        type: string
        required: true
        maxLength: 3
        pattern: "^[A-Z]{3}$"
        label: Valuta
    keys:
      - name: uk_bankaccount_number
        fields: [accountNumber]
        scopeToCompany: true

  # En betalingsbunt: leverandørposter som skal betales sammen. Lages med forslag fra forfalte åpne poster (feltet «Forfall til
  # og med») og går gjennom godkjenningsflyten før den sendes.
  finance.paymentbatch:
    label: Betalingsbunt
    fields:
      name:
        type: string
        required: true
        maxLength: 100
        label: Navn
      bankAccount:
        type: reference
        to: finance.bankaccount
        required: true
        label: Betales fra
      executionDate:
        type: date
        required: true
        label: Betalingsdato
      dueUntil:
        type: date
        label: Forfall til og med (lager forslag)
      totalAmount:
        type: decimal
        scale: 2
        default: 0
        label: Sum
      paymentCount:
        type: integer
        default: 0
        label: Antall betalinger
      status:
        type: enum
        of: finance.batchstatus
        required: true
        default: draft
        label: Status
      deliveryStatus:
        type: enum
        of: finance.deliverystatus
        required: true
        default: none
        label: Sendt til bank
      file:
        type: uuid
        label: Betalingsfil
      message:
        type: string
        maxLength: 2000
        label: Melding fra bankadapter
    status:
      field: status
      initial: draft
      transitions:
        submit:
          from: draft
          to: pending
          permission: update
          workflow: finance.paymentbatch.approval
        approve:
          from: pending
          to: approved
          permission: approve
        reject:
          from: pending
          to: draft
          permission: approve
        # Godkjenning og frigivelse til banken er to ulike handlinger (og kan gjøres av ulike personer): adapteren handler med
        # rettighetene til den som frigir.
        release:
          from: approved
          to: released
          permission: post

  finance.payment:
    label: Betaling
    fields:
      batch:
        type: reference
        to: finance.paymentbatch
        required: true
        onDelete: cascade
        label: Bunt
      openItem:
        type: reference
        to: finance.openitem
        label: Åpen post
      party:
        type: reference
        to: core.party
        required: true
        label: Leverandør
      creditorName:
        type: string
        required: true
        maxLength: 200
        label: Mottaker
      creditorAccount:
        type: string
        maxLength: 34
        label: Mottakers konto
      amount:
        type: decimal
        required: true
        scale: 2
        minValue: 0.01
        label: Beløp
      currency:
        type: string
        required: true
        maxLength: 3
        pattern: "^[A-Z]{3}$"
        label: Valuta
      paymentReference:
        type: string
        maxLength: 35
        label: Betalingsreferanse
      message:
        type: string
        maxLength: 140
        label: Melding til mottaker
      dueDate:
        type: date
        label: Forfallsdato
    keys:
      - name: uk_payment_openitem
        fields: [openItem]
        scopeToCompany: true

  # Det banken melder tilbake. Adapteren lager disse; avstemming mot hovedboken kommer i neste steg.
  finance.bankstatement:
    label: Bankutskrift
    fields:
      bankAccount:
        type: reference
        to: finance.bankaccount
        required: true
        label: Bankkonto
      externalId:
        type: string
        required: true
        maxLength: 100
        label: Utskriftens id
      fromDate:
        type: date
        label: Fra dato
      toDate:
        type: date
        label: Til dato
      openingBalance:
        type: decimal
        scale: 2
        label: Inngående saldo
      closingBalance:
        type: decimal
        scale: 2
        label: Utgående saldo
      currency:
        type: string
        maxLength: 3
        label: Valuta
    keys:
      - name: uk_bankstatement_external
        fields: [externalId]
        scopeToCompany: true

  finance.banktransaction:
    label: Banktransaksjon
    fields:
      bankAccount:
        type: reference
        to: finance.bankaccount
        required: true
        label: Bankkonto
      statement:
        type: reference
        to: finance.bankstatement
        label: Bankutskrift
      externalId:
        type: string
        required: true
        maxLength: 200
        label: Transaksjonens id
      bookingDate:
        type: date
        required: true
        label: Bokført
      valueDate:
        type: date
        label: Valuteringsdato
      amount:
        type: decimal
        required: true
        scale: 2
        label: Beløp (innbetaling positiv, utbetaling negativ)
      currency:
        type: string
        required: true
        maxLength: 3
        label: Valuta
      counterpartyName:
        type: string
        maxLength: 200
        label: Motpart
      counterpartyAccount:
        type: string
        maxLength: 34
        label: Motparts konto
      paymentReference:
        type: string
        maxLength: 35
        label: Betalingsreferanse
      message:
        type: string
        maxLength: 500
        label: Melding
      endToEndId:
        type: string
        maxLength: 100
        label: Ende-til-ende-id
      status:
        type: enum
        of: finance.transactionstatus
        required: true
        default: new
        label: Status
    keys:
      - name: uk_banktransaction_external
        fields: [externalId]
        scopeToCompany: true

# Leverandørens bankkonto, brukt som forslag når en betalingsbunt lages.
extensions:
  core.party:
    fields:
      bankAccount:
        type: string
        maxLength: 34
        label: Bankkonto (for utbetaling)

workflows:
  - id: finance.paymentbatch.approval
    object: finance.paymentbatch
    trigger: submit
    mode: sequential
    delegation: allowed
    onComplete: approve
    onReject: reject
    steps:
      - name: Godkjenn betalinger
        assignee: { role: finance.approver }
        when: { field: totalAmount, gt: 0 }

events:
  publishes:
    - finance.journal.posted@1
    - finance.settlement.completed@1
    - finance.paymentbatch.released@1
  subscribes:
    - core.fiscalyear.created@1: OnFiscalYearCreated

pages:
  - pages/settings-list.yaml
  - pages/account-list.yaml
  - pages/account-card.yaml
  - pages/voucher-list.yaml
  - pages/voucher-card.yaml
  - pages/journalentry-list.yaml
  - pages/journalentry-card.yaml
  - pages/posting-list.yaml
  - pages/openitem-list.yaml
  - pages/bankaccount-list.yaml
  - pages/bankaccount-card.yaml
  - pages/paymentbatch-list.yaml
  - pages/paymentbatch-card.yaml
  - pages/bankstatement-list.yaml
  - pages/banktransaction-list.yaml

permissionSets:
  - id: finance.admin
    label: Regnskap – innstillinger
    grants:
      finance.settings: [read, create, update]
      finance.bankaccount: [read, create, update, delete]
  - id: finance.approver
    label: Regnskap – godkjenning av betalinger
    grants:
      finance.paymentbatch: [read, approve]
      finance.payment: [read]
      finance.bankaccount: [read]
  - id: finance.reader
    label: Regnskap – lesetilgang
    grants:
      finance.settings: [read]
      finance.account: [read]
      finance.voucher: [read]
      finance.voucherline: [read]
      finance.journalentry: [read]
      finance.posting: [read]
      finance.openitem: [read]
      finance.settlement: [read]
      finance.settlementitem: [read]
      finance.bankaccount: [read]
      finance.paymentbatch: [read]
      finance.payment: [read]
      finance.bankstatement: [read]
      finance.banktransaction: [read]
  - id: finance.bookkeeper
    label: Regnskap – bokføring
    grants:
      finance.settings: [read]
      finance.account: [read, create, update, delete]
      finance.voucher: [read, create, update, delete, post]
      finance.voucherline: [read, create, update, delete]
      finance.journalentry: [read, create]
      finance.posting: [read, create]
      finance.openitem: [read, create, update]
      finance.settlement: [read, create, update, delete, post]
      finance.settlementitem: [read, create, update, delete]
      finance.bankaccount: [read]
      finance.paymentbatch: [read, create, update, delete, post]
      finance.payment: [read, create, update, delete]
      finance.bankstatement: [read, create, update]
      finance.banktransaction: [read, create, update]
