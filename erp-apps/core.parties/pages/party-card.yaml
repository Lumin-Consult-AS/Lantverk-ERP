id: core.party-card
type: card
object: core.party
title: "{partyNumber} – {name}"
groups:
  - label: parties.card.general
    fields:
      - partyNumber
      - name
      - partyType
      - role
      - organizationNumber
      - status
      - isActive
  - label: parties.card.contact
    fields:
      - email
      - phone
actions:
  - id: deactivate
    label: parties.actions.deactivate
    transition: deactivate
    placement: secondary
  - id: activate
    label: parties.actions.activate
    transition: activate
    placement: primary
  - id: block
    label: parties.actions.block
    transition: block
    placement: danger
  - id: unblock
    label: parties.actions.unblock
    transition: unblock
    placement: secondary
tabs:
  - label: parties.card.addresses
    list:
      object: core.partyaddress
      filter:
        party: "{id}"
      fields:
        - addressType
        - streetLine1
        - postalCode
        - city
        - countryCode
        - isPrimary
  - label: parties.card.contacts
    list:
      object: core.partycontact
      filter:
        party: "{id}"
      fields:
        - fullName
        - roleTitle
        - email
        - phone
        - isPrimary

