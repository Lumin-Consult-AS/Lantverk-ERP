id: core.dimensions
version: 1.0.0
name: Dimensjoner
publisher: Laftverk
license: proprietary
sdk: ">=1.0.0 <2.0.0"

objects:
  core.dimension:
    label: Dimensjon
    fields:
      code:
        type: string
        required: true
        maxLength: 20
        label: Kode
      name:
        type: string
        required: true
        maxLength: 100
        label: Navn
      isActive:
        type: boolean
        required: true
        default: true
        label: Aktiv
    keys:
      - name: uk_dimension_code
        fields: [code]
        scopeToCompany: true

  core.dimensionvalue:
    label: Dimensjonsverdi
    fields:
      dimension:
        type: reference
        to: core.dimension
        required: true
        onDelete: cascade
        label: Dimensjon
      code:
        type: string
        required: true
        maxLength: 30
        label: Kode
      name:
        type: string
        required: true
        maxLength: 100
        label: Navn
      validFrom:
        type: date
        label: Gyldig fra
      validTo:
        type: date
        label: Gyldig til
      isActive:
        type: boolean
        required: true
        default: true
        label: Aktiv
    keys:
      - name: uk_dimensionvalue_code
        fields: [dimension, code]
        scopeToCompany: true

events:
  publishes:
    - core.dimensionvalue.created@1
    - core.dimensionvalue.updated@1
    - core.dimensionvalue.deleted@1

pages:
  - pages/dimension-list.yaml
  - pages/dimension-card.yaml

permissionSets:
  - id: core.dimensions.reader
    label: Dimensjoner – lesetilgang
    grants:
      core.dimension: [read]
      core.dimensionvalue: [read]
  - id: core.dimensions.manager
    label: Dimensjoner – full tilgang
    grants:
      core.dimension: [read, create, update, delete]
      core.dimensionvalue: [read, create, update, delete]
